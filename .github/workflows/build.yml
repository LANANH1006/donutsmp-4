              static final Random R = new Random();
              static final Gson GSON = new GsonBuilder().setPrettyPrinting().create();
              static Save save = new Save();
              static Path file;
              static MinecraftServer SERVER;
              static long tick = 0;

              static {
                  PRICES.put("diamond", 100.0); PRICES.put("emerald", 40.0); PRICES.put("iron_ingot", 10.0);
                  PRICES.put("gold_ingot", 15.0); PRICES.put("netherite_ingot", 800.0); PRICES.put("coal", 3.0);
                  PRICES.put("copper_ingot", 4.0); PRICES.put("redstone", 3.0); PRICES.put("lapis_lazuli", 4.0);
                  PRICES.put("oak_log", 2.0); PRICES.put("cobblestone", 0.5); PRICES.put("bread", 3.0);
                  PRICES.put("golden_apple", 60.0); PRICES.put("ender_pearl", 25.0); PRICES.put("blaze_rod", 15.0);
                  PRICES.put("obsidian", 8.0); PRICES.put("arrow", 1.0); PRICES.put("cooked_beef", 4.0);
                  PRICES.put("diamond_sword", 250.0); PRICES.put("iron_sword", 40.0); PRICES.put("elytra", 3000.0);
              }

              @Override
              public void onInitialize() {
                  file = FabricLoader.getInstance().getConfigDir().resolve("donutlike.json");
                  load();
                  if (save.baseCells == null) save.baseCells = new HashSet<>();
                  Duels.init();
                  Market.init();
                  Combat.init();
                  Notes.init();
                  AntiLag.init();

                  ServerLifecycleEvents.SERVER_STARTED.register(s -> SERVER = s);
                  ServerLifecycleEvents.SERVER_STOPPING.register(s -> {
                      Duels.endAll(s);
                      doSave(); // /ah duoc luu xuong file, nguoi ban offline khong mat do
                  });
                  ServerTickEvents.END_SERVER_TICK.register(s -> {
                      tick++;
                      Duels.tick(s);
                      if (tick % 20 == 0) everySecond(s);
                  });

                  CommandRegistrationCallback.EVENT.register((dispatcher, registryAccess, env) -> {
                      // /spawn
                      dispatcher.register(CommandManager.literal("spawn").executes(ctx -> {
                          ServerPlayerEntity p = ctx.getSource().getPlayerOrThrow();
                          if (Duels.inDuel(p)) { msg(p, "§cKhông thể dùng lệnh này khi đang duel."); return 0; }
                          if (Combat.tagged(p)) { msg(p, "§cKhông thể /spawn khi đang combat!"); return 0; }
                          ServerWorld w = ctx.getSource().getServer().getOverworld();
                          double x, y, z;
                          if (save.spawn != null) { x = save.spawn[0]; y = save.spawn[1]; z = save.spawn[2]; }
                          else {
                              BlockPos sp = w.getSpawnPos();
                              x = sp.getX() + 0.5; z = sp.getZ() + 0.5;
                              y = w.getTopY(Heightmap.Type.MOTION_BLOCKING, sp.getX(), sp.getZ());
                          }
                          p.teleport(w, x, y, z, Set.of(), p.getYaw(), p.getPitch(), true);
                          msg(p, "§aĐã dịch chuyển về spawn!");
                          return 1;
                      }));

                      // /setspawn (op)
                      dispatcher.register(CommandManager.literal("setspawn").requires(src -> src.hasPermissionLevel(2)).executes(ctx -> {
                          ServerPlayerEntity p = ctx.getSource().getPlayerOrThrow();
                          save.spawn = new double[]{p.getX(), p.getY(), p.getZ()};
                          doSave();
                          msg(p, "§aĐã đặt spawn tại vị trí hiện tại.");
                          return 1;
                      }));

                      // /bal
                      dispatcher.register(CommandManager.literal("bal").executes(ctx -> {
                          ServerPlayerEntity p = ctx.getSource().getPlayerOrThrow();
                          msg(p, "§eSố dư: §a$" + fmt(bal(p.getUuid())));
                          return 1;
                      }));

                      // /pay <player> <amount>
                      dispatcher.register(CommandManager.literal("pay")
                          .then(CommandManager.argument("player", EntityArgumentType.player())
                          .then(CommandManager.argument("amount", DoubleArgumentType.doubleArg(0.01)).executes(ctx -> {
                              ServerPlayerEntity p = ctx.getSource().getPlayerOrThrow();
                              ServerPlayerEntity t = EntityArgumentType.getPlayer(ctx, "player");
                              double a = DoubleArgumentType.getDouble(ctx, "amount");
                              if (bal(p.getUuid()) < a) { msg(p, "§cBạn không đủ tiền."); return 0; }
                              add(p.getUuid(), -a); add(t.getUuid(), a);
                              msg(p, "§aĐã chuyển $" + fmt(a) + " cho " + t.getName().getString());
                              msg(t, "§aBạn nhận được $" + fmt(a) + " từ " + p.getName().getString());
                              return 1;
                          }))));

                      Admin.register(dispatcher);
                      Market.register(dispatcher, registryAccess);
                      Combat.register(dispatcher);
                      Notes.register(dispatcher);
                      AntiLag.register(dispatcher);
                      ExtraCommands.register(dispatcher);
                      Hud.register(dispatcher);
                      Duels.register(dispatcher);

                      // /randombase [intact|raided] (op) - sinh 1 can cu gan ban
                      dispatcher.register(CommandManager.literal("randombase").requires(src -> src.hasPermissionLevel(2) && Admin.on("bases"))
                          .executes(ctx -> runRandomBase(ctx.getSource(), null))
                          .then(CommandManager.literal("intact").executes(ctx -> runRandomBase(ctx.getSource(), false)))
                          .then(CommandManager.literal("raided").executes(ctx -> runRandomBase(ctx.getSource(), true))));
                  });
              }

              static int runRandomBase(net.minecraft.server.command.ServerCommandSource src, Boolean raided) throws com.mojang.brigadier.exceptions.CommandSyntaxException {
                  ServerPlayerEntity p = src.getPlayerOrThrow();
                  Bases.Result r = Bases.spawnNear(src.getServer().getOverworld(), p.getBlockPos(), 40, 80, raided);
                  if (r == null) { msg(p, "§cKhông tìm được chỗ đặt căn cứ, thử lại."); return 0; }
                  msg(p, "§6Căn cứ " + r.style() + (r.raided() ? " (đã bị raid)" : " (còn nguyên)") + " tại "
                          + r.pos().getX() + " " + r.pos().getY() + " " + r.pos().getZ());
                  return 1;
              }

              // ===== Vong lap moi giay =====
              static void everySecond(MinecraftServer s) {
                  ExtraCommands.everySecond(s);
                  if (Admin.on("sidebar")) Hud.everySecond(s);
                  if (tick % 40 == 0 && Admin.on("bases")) Bases.scatterTick(s);
                  Combat.everySecond(s);
                  AntiLag.everySecond(s);

                  // sinh can cu ngau nhien
                  if (tick % (20L * BASE_INTERVAL_SECONDS) == 0 && Admin.on("bases")) {
                      List<ServerPlayerEntity> ps = s.getPlayerManager().getPlayerList();
                      if (!ps.isEmpty()) {
                          ServerPlayerEntity p = ps.get(R.nextInt(ps.size()));
                          if (spawnBaseNear(s.getOverworld(), p.getBlockPos(), 150, 400) != null)
                              for (ServerPlayerEntity q : ps) msg(q, "§6Một căn cứ mới vừa xuất hiện đâu đó trong thế giới...");
                      }
                  }

                  if (tick % (20 * 300) == 0) doSave();
              }

              // ===== Can cu ngau nhien (xem Bases.java) =====
              static BlockPos spawnBaseNear(ServerWorld w, BlockPos origin, int minD, int maxD) {
                  Bases.Result r = Bases.spawnNear(w, origin, minD, maxD, null);
                  return r == null ? null : r.pos();
              }

              static void set(ServerWorld w, BlockPos p, Block b) { w.setBlockState(p, b.getDefaultState(), Block.NOTIFY_LISTENERS); }

              // ===== Tien & tien ich =====
              public static double bal(UUID id) { return save.bal.getOrDefault(id.toString(), START_MONEY); }
              public static void add(UUID id, double a) { save.bal.put(id.toString(), bal(id) + a); }
              public static double value(Item i) { return PRICES.getOrDefault(Registries.ITEM.getId(i).getPath(), 2.0); }
              public static String fmt(double d) { return String.format("%.2f", d); }
              public static void msg(ServerPlayerEntity p, String s) { p.sendMessage(Text.literal(s), false); }

              static void load() {
                  try { if (Files.exists(file)) { Save s = GSON.fromJson(Files.readString(file), Save.class); if (s != null) save = s; } }
                  catch (Exception e) { e.printStackTrace(); }
              }
              static void doSave() {
                  try { Market.snapshot(); } catch (Exception e) { e.printStackTrace(); }
                  try { Files.writeString(file, GSON.toJson(save)); } catch (Exception e) { e.printStackTrace(); }
              }
          }
          EOF_DL
          mkdir -p "src/main/java/com/donutlike"
          cat > "src/main/java/com/donutlike/Duels.java" <<'EOF_DL'
          package com.donutlike;

          import com.mojang.brigadier.CommandDispatcher;
          import com.mojang.brigadier.arguments.BoolArgumentType;
          import com.mojang.brigadier.arguments.DoubleArgumentType;
          import com.mojang.brigadier.arguments.IntegerArgumentType;
          import com.mojang.brigadier.arguments.StringArgumentType;
          import com.mojang.brigadier.context.CommandContext;
          import com.mojang.brigadier.exceptions.CommandSyntaxException;
          import net.fabricmc.fabric.api.entity.event.v1.ServerLivingEntityEvents;
          import net.fabricmc.fabric.api.networking.v1.ServerPlayConnectionEvents;
          import net.minecraft.block.Block;
          import net.minecraft.block.Blocks;
          import net.minecraft.command.CommandSource;
          import net.minecraft.entity.Entity;
          import net.minecraft.entity.EntityType;
          import net.minecraft.entity.EquipmentSlot;
          import net.minecraft.entity.LivingEntity;
          import net.minecraft.entity.SpawnReason;
          import net.minecraft.entity.attribute.EntityAttribute;
          import net.minecraft.entity.attribute.EntityAttributeInstance;
          import net.minecraft.entity.attribute.EntityAttributes;
          import net.minecraft.entity.mob.MobEntity;
          import net.minecraft.entity.player.PlayerEntity;
          import net.minecraft.item.Item;
          import net.minecraft.item.ItemStack;
          import net.minecraft.item.Items;
          import net.minecraft.particle.ParticleTypes;
          import net.minecraft.registry.RegistryKey;
          import net.minecraft.registry.RegistryKeys;
          import net.minecraft.registry.entry.RegistryEntry;
          import net.minecraft.server.MinecraftServer;
          import net.minecraft.server.command.ServerCommandSource;
          import net.minecraft.server.network.ServerPlayerEntity;
          import net.minecraft.server.world.ServerWorld;
          import net.minecraft.sound.SoundCategory;
          import net.minecraft.sound.SoundEvents;
          import net.minecraft.text.Text;
          import net.minecraft.util.Identifier;
          import net.minecraft.util.math.BlockPos;
          import net.minecraft.util.math.Box;
          import net.minecraft.world.World;

          import java.util.*;

          import static net.minecraft.server.command.CommandManager.argument;
          import static net.minecraft.server.command.CommandManager.literal;

          public class Duels {

              // ===== Dau truong (tren cao, trong the gioi chinh) =====
              static final int AX = 8000, AY = 200, AZ = 8000;

              static class Spec {
                  String name; double health, damage, speed, reward; int tier, totems; boolean crystals;
                  Spec(String n, double h, double d, int t, double sp, int tot, boolean c, double r) {
                      name = n; health = h; damage = d; tier = t; speed = sp; totems = tot; crystals = c; reward = r;
                  }
              }

              static class Duel {
                  UUID player, bot; Spec spec; double bet; int totems; boolean ending;
                  ItemStack[] saved; String backDim; double bx, by, bz; float byaw, bpitch;
              }

              static class Task { long at; Runnable r; }

              static final Map<String, Spec> SPECS = new LinkedHashMap<>();
              static final Map<UUID, Duel> DUELS = new HashMap<>();
              static final List<Task> TASKS = new ArrayList<>();

              // tier: 0 khong, 1 da, 2 sat, 3 kim cuong, 4 netherite
              static final Item[][] ARMOR = {
                  {},
                  {Items.LEATHER_HELMET, Items.LEATHER_CHESTPLATE, Items.LEATHER_LEGGINGS, Items.LEATHER_BOOTS},
                  {Items.IRON_HELMET, Items.IRON_CHESTPLATE, Items.IRON_LEGGINGS, Items.IRON_BOOTS},
                  {Items.DIAMOND_HELMET, Items.DIAMOND_CHESTPLATE, Items.DIAMOND_LEGGINGS, Items.DIAMOND_BOOTS},
                  {Items.NETHERITE_HELMET, Items.NETHERITE_CHESTPLATE, Items.NETHERITE_LEGGINGS, Items.NETHERITE_BOOTS}
              };
              static final Item[] SWORD = {null, Items.WOODEN_SWORD, Items.IRON_SWORD, Items.DIAMOND_SWORD, Items.NETHERITE_SWORD};
              static final double[] BONUS = {0, 3, 5, 6, 7};
              static final EquipmentSlot[] SLOTS = {EquipmentSlot.HEAD, EquipmentSlot.CHEST, EquipmentSlot.LEGS, EquipmentSlot.FEET};

              static {
                  //                      ten      mau  sat thuong tier toc do  totem crystal thuong
                  SPECS.put("noob",   new Spec("Noob",   20, 3.5, 1, 0.18, 0, false, 50));
                  SPECS.put("normal", new Spec("Normal", 20, 6.0, 2, 0.23, 0, false, 150));
                  SPECS.put("pro",    new Spec("Pro",    20, 7.0, 4, 0.27, 1, false, 400));
                  SPECS.put("cpvp",   new Spec("CPVP",   20, 8.0, 4, 0.28, 3, true, 1000));
              }

              public static boolean inDuel(ServerPlayerEntity p) { return DUELS.containsKey(p.getUuid()); }

              static void later(long ticks, Runnable r) {
                  Task t = new Task(); t.at = DonutLike.tick + ticks; t.r = r; TASKS.add(t);
              }

              // ===== Dang ky =====
              static void init() {
                  ServerLivingEntityEvents.ALLOW_DEATH.register((entity, src, amt) -> {
                      if (entity instanceof ServerPlayerEntity p) {
                          Duel d = DUELS.get(p.getUuid());
                          if (d == null) return true;
                          p.setHealth(p.getMaxHealth());
                          p.extinguish();
                          if (!d.ending) {
                              d.ending = true;
                              later(1, () -> { if (DonutLike.SERVER != null) endDuel(DonutLike.SERVER, d, false); });
                          }
                          return false;
                      }
                      for (Duel d : DUELS.values()) {
                          if (!d.ending && d.totems > 0 && d.bot.equals(entity.getUuid())) {
                              d.totems--;
                              entity.setHealth(entity.getMaxHealth() * 0.5f);
                              if (entity.getWorld() instanceof ServerWorld sw) {
                                  sw.spawnParticles(ParticleTypes.TOTEM_OF_UNDYING, entity.getX(), entity.getY() + 1, entity.getZ(), 30, 0.3, 0.5, 0.3, 0.2);
                                  sw.playSound(null, entity.getX(), entity.getY(), entity.getZ(), SoundEvents.ITEM_TOTEM_USE, SoundCategory.HOSTILE, 1f, 1f);
                              }
                              ServerPlayerEntity pl = DonutLike.SERVER == null ? null : DonutLike.SERVER.getPlayerManager().getPlayer(d.player);
                              if (pl != null) DonutLike.msg(pl, "§e[Bot] đã pop totem! Còn " + d.totems + " totem.");
                              return false;
                          }
                      }
                      return true;
                  });

                  ServerLivingEntityEvents.AFTER_DEATH.register((entity, src) -> {
                      if (entity instanceof ServerPlayerEntity p) {
                          ExtraCommands.inc(DonutLike.save.deaths, p.getUuid(), 1);
                          if (src.getAttacker() instanceof ServerPlayerEntity k && k != p)
                              ExtraCommands.inc(DonutLike.save.kills, k.getUuid(), 1);
                      }
                  });

                  ServerPlayConnectionEvents.DISCONNECT.register((handler, server) -> {
                      Duel d = DUELS.get(handler.getPlayer().getUuid());
                      if (d != null) { d.ending = true; endDuel(server, d, false); }
                  });
              }

              static void endAll(MinecraftServer s) {
                  for (Duel d : new ArrayList<>(DUELS.values())) { d.ending = true; endDuel(s, d, false); }
              }

              // ===== Lenh =====
              static void register(CommandDispatcher<ServerCommandSource> disp) {
                  disp.register(literal("duel").requires(s -> Admin.on("duels"))
                      .then(literal("bot")
                          .then(argument("level", StringArgumentType.word())
                              .suggests((c, b) -> CommandSource.suggestMatching(List.of("noob", "normal", "pro", "cpvp"), b))
                              .executes(c -> cmdBot(c, 0))
                              .then(argument("bet", DoubleArgumentType.doubleArg(1)).executes(c -> cmdBot(c, DoubleArgumentType.getDouble(c, "bet"))))))
                      .then(literal("custom")
                          .then(argument("health", IntegerArgumentType.integer(1, 200))
                          .then(argument("damage", DoubleArgumentType.doubleArg(0.5, 30))
                          .then(argument("speed", DoubleArgumentType.doubleArg(0.1, 0.6))
                          .then(argument("armor", IntegerArgumentType.integer(0, 4))
                          .then(argument("totems", IntegerArgumentType.integer(0, 10))
                          .then(argument("crystals", BoolArgumentType.bool()).executes(c -> {
                              ServerPlayerEntity p = c.getSource().getPlayerOrThrow();
                              Spec sp = new Spec("Custom",
                                  IntegerArgumentType.getInteger(c, "health"),
                                  DoubleArgumentType.getDouble(c, "damage"),
                                  IntegerArgumentType.getInteger(c, "armor"),
                                  DoubleArgumentType.getDouble(c, "speed"),
                                  IntegerArgumentType.getInteger(c, "totems"),
                                  BoolArgumentType.getBool(c, "crystals"), 0);
                              startDuel(p, sp, 0);
                              return 1;
                          }))))))))
                      .then(literal("leave").executes(c -> {
                          ServerPlayerEntity p = c.getSource().getPlayerOrThrow();
                          Duel d = DUELS.get(p.getUuid());
                          if (d == null) { DonutLike.msg(p, "§cBạn không ở trong duel."); return 0; }
                          d.ending = true;
                          endDuel(c.getSource().getServer(), d, false);
                          return 1;
                      })));
              }

              static int cmdBot(CommandContext<ServerCommandSource> c, double bet) throws CommandSyntaxException {
                  ServerPlayerEntity p = c.getSource().getPlayerOrThrow();
                  Spec sp = SPECS.get(StringArgumentType.getString(c, "level").toLowerCase());
                  if (sp == null) { DonutLike.msg(p, "§cLevel hợp lệ: noob, normal, pro, cpvp"); return 0; }
                  startDuel(p, sp, bet);
                  return 1;
              }

              // ===== Bat dau duel =====
              static void startDuel(ServerPlayerEntity p, Spec sp, double bet) {
                  if (!DUELS.isEmpty()) { DonutLike.msg(p, "§cĐấu trường đang có người duel, thử lại sau."); return; }
                  if (DonutLike.bal(p.getUuid()) < bet) { DonutLike.msg(p, "§cKhông đủ tiền cược."); return; }
                  MinecraftServer s = p.getServer();
                  ServerWorld ow = s.getOverworld();

                  buildArena(ow);

                  MobEntity bot = EntityType.HUSK.create(ow, SpawnReason.COMMAND);
                  if (bot == null) { DonutLike.msg(p, "§cKhông tạo được bot."); return; }
                  bot.refreshPositionAndAngles(AX + 8.5, AY, AZ + 0.5, 90f, 0f);
                  attr(bot, EntityAttributes.MAX_HEALTH, sp.health);
                  bot.setHealth((float) sp.health);
                  attr(bot, EntityAttributes.ATTACK_DAMAGE, Math.max(0.1, sp.damage - BONUS[sp.tier]));
                  attr(bot, EntityAttributes.MOVEMENT_SPEED, sp.speed);
                  attr(bot, EntityAttributes.FOLLOW_RANGE, 40);
                  if (sp.tier > 0) {
                      for (int i = 0; i < 4; i++) bot.equipStack(SLOTS[i], new ItemStack(ARMOR[sp.tier][i]));
                      if (sp.damage >= BONUS[sp.tier]) bot.equipStack(EquipmentSlot.MAINHAND, new ItemStack(SWORD[sp.tier]));
                  }
                  bot.setCustomName(Text.literal("§c[Bot " + sp.name + "]"));
                  bot.setCustomNameVisible(true);
                  bot.setPersistent();
                  bot.setAiDisabled(true); // dung yen trong luc dem nguoc
                  ow.spawnEntity(bot);

                  Duel d = new Duel();
                  d.player = p.getUuid(); d.bot = bot.getUuid(); d.spec = sp; d.bet = bet; d.totems = sp.totems;
                  d.backDim = p.getWorld().getRegistryKey().getValue().toString();
                  d.bx = p.getX(); d.by = p.getY(); d.bz = p.getZ(); d.byaw = p.getYaw(); d.bpitch = p.getPitch();
                  d.saved = new ItemStack[p.getInventory().size()];
                  for (int i = 0; i < d.saved.length; i++) d.saved[i] = p.getInventory().getStack(i).copy();
                  DUELS.put(p.getUuid(), d);

                  DonutLike.add(p.getUuid(), -bet);
                  p.getInventory().clear();
                  giveKit(p, sp);
                  p.setHealth(p.getMaxHealth());
                  p.getHungerManager().setFoodLevel(20);
                  p.clearStatusEffects();
                  p.extinguish();
                  p.teleport(ow, AX - 7.5, AY, AZ + 0.5, Set.of(), -90f, 0f, true);

                  DonutLike.msg(p, "§6Duel với Bot " + sp.name + (bet > 0 ? " §7(cược $" + DonutLike.fmt(bet) + ")" : "") + " §6bắt đầu sau 3 giây!");
                  for (int i = 1; i <= 3; i++) {
                      final int n = 3 - i;
                      later(20L * i, () -> { if (n > 0) DonutLike.msg(p, "§e" + n + "..."); });
                  }
                  later(60, () -> {
                      Entity e = ow.getEntity(d.bot);
                      if (e instanceof MobEntity m) m.setAiDisabled(false);
                      ServerPlayerEntity pl = s.getPlayerManager().getPlayer(d.player);
                      if (pl != null) DonutLike.msg(pl, "§c§lFIGHT!");
                  });
              }

              static void giveKit(ServerPlayerEntity p, Spec sp) {
                  int pt = Math.max(2, sp.tier);
                  for (int i = 0; i < 4; i++) p.equipStack(SLOTS[i], new ItemStack(ARMOR[pt][i]));
                  p.getInventory().setStack(0, new ItemStack(SWORD[pt]));
                  p.getInventory().setStack(1, new ItemStack(Items.GOLDEN_APPLE, 16));
                  p.getInventory().setStack(2, new ItemStack(Items.COOKED_BEEF, 32));
                  if (sp.crystals) {
                      p.getInventory().setStack(3, new ItemStack(Items.END_CRYSTAL, 16));
                      p.getInventory().setStack(4, new ItemStack(Items.OBSIDIAN, 16));
                  }
                  if (pt == 4) p.equipStack(EquipmentSlot.OFFHAND, new ItemStack(Items.TOTEM_OF_UNDYING));
              }

              // ===== Ket thuc duel =====
              static void endDuel(MinecraftServer s, Duel d, boolean win) {
                  if (DUELS.remove(d.player) == null) return;
                  ServerWorld ow = s.getOverworld();
                  Entity bot = ow.getEntity(d.bot);
                  if (bot != null) bot.discard();

                  ServerPlayerEntity p = s.getPlayerManager().getPlayer(d.player);
                  if (p != null) {
                      p.getInventory().clear();
                      for (int i = 0; i < d.saved.length; i++) p.getInventory().setStack(i, d.saved[i]);
                      p.setHealth(p.getMaxHealth());
                      p.getHungerManager().setFoodLevel(20);
                      p.clearStatusEffects();
                      p.extinguish();
                      ServerWorld bw = s.getWorld(RegistryKey.of(RegistryKeys.WORLD, Identifier.of(d.backDim)));
                      if (bw == null) bw = ow;
                      p.teleport(bw, d.bx, d.by, d.bz, Set.of(), d.byaw, d.bpitch, true);
                  }

                  String id = d.player.toString();
                  if (win) {
                      double prize = d.bet * 2 + d.spec.reward;
                      DonutLike.add(d.player, prize);
                      ExtraCommands.inc(DonutLike.save.duelWins, d.player, 1);
                      if (d.spec.reward > 0) ExtraCommands.inc(DonutLike.save.shards, d.player, Math.max(1, (int) (d.spec.reward / 100)));
                      if (p != null) DonutLike.msg(p, "§a§lBẠN THẮNG! §eNhận $" + DonutLike.fmt(prize));
                  } else {
                      ExtraCommands.inc(DonutLike.save.duelLosses, d.player, 1);
                      if (p != null) DonutLike.msg(p, "§c§lBẠN THUA!" + (d.bet > 0 ? " §7Mất $" + DonutLike.fmt(d.bet) : ""));
                  }

                  // don rac trong dau truong sau 2 giay
                  later(40, () -> {
                      Box box = new Box(AX - 14, AY - 2, AZ - 14, AX + 14, AY + 12, AZ + 14);
                      for (Entity e : ow.getEntitiesByClass(Entity.class, box, e -> !(e instanceof PlayerEntity))) e.discard();
                  });
              }

              // ===== Moi tick =====
              static void tick(MinecraftServer s) {
                  if (!TASKS.isEmpty()) {
                      for (Task t : new ArrayList<>(TASKS)) {
                          if (DonutLike.tick >= t.at) { TASKS.remove(t); t.r.run(); }
                      }
                  }
                  if (DUELS.isEmpty()) return;
                  ServerWorld ow = s.getOverworld();
                  for (Duel d : new ArrayList<>(DUELS.values())) {
                      if (d.ending) continue;
                      ServerPlayerEntity p = s.getPlayerManager().getPlayer(d.player);
                      if (p == null) { d.ending = true; endDuel(s, d, false); continue; }
                      Entity e = ow.getEntity(d.bot);
                      if (!(e instanceof MobEntity bot) || !bot.isAlive()) { d.ending = true; endDuel(s, d, true); continue; }
                      if (DonutLike.tick % 20 == 0) bot.setTarget(p);
                      if (d.spec.crystals && !bot.isAiDisabled() && DonutLike.tick % 50 == 0 && DonutLike.R.nextInt(100) < 70)
                          crystalHit(ow, bot, p);
                  }
              }

              // Mo phong crystal: no ngay canh nguoi choi (khong pha block)
              static void crystalHit(ServerWorld w, MobEntity bot, ServerPlayerEntity p) {
                  double dx = p.getX() - bot.getX(), dz = p.getZ() - bot.getZ();
                  double len = Math.max(0.001, Math.sqrt(dx * dx + dz * dz));
                  double x = p.getX() + dx / len * 2.5, z = p.getZ() + dz / len * 2.5;
                  w.createExplosion(null, x, p.getY() + 0.2, z, 3.0f, World.ExplosionSourceType.NONE);
              }

              // ===== Dau truong =====
              static void buildArena(ServerWorld w) {
                  for (int dx = -12; dx <= 12; dx++) {
                      for (int dz = -12; dz <= 12; dz++) {
                          boolean edge = Math.abs(dx) == 12 || Math.abs(dz) == 12;
                          DonutLike.set(w, new BlockPos(AX + dx, AY - 1, AZ + dz), (dx + dz) % 4 == 0 ? Blocks.SEA_LANTERN : Blocks.DEEPSLATE_TILES);
                          for (int dy = 0; dy <= 6; dy++) {
                              Block b = (edge && dy <= 5) ? Blocks.GLASS : Blocks.AIR;
                              DonutLike.set(w, new BlockPos(AX + dx, AY + dy, AZ + dz), b);
                          }
                      }
                  }
              }

              static void attr(LivingEntity e, RegistryEntry<EntityAttribute> a, double v) {
                  EntityAttributeInstance i = e.getAttributeInstance(a);
                  if (i != null) i.setBaseValue(v);
              }
          }
          EOF_DL
