name: Build mod

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12

      - name: Write project files
        run: |
          mkdir -p "$RUNNER_TEMP/proj" && cd "$RUNNER_TEMP/proj"
          cat > ".gitignore" <<'EOF_DL'
          .gradle/
          build/
          run/
          .idea/
          *.iml
          .vscode/
          EOF_DL
          cat > "build.gradle" <<'EOF_DL'
          plugins {
              id 'fabric-loom' version '1.9-SNAPSHOT'
          }

          version = project.mod_version
          group = project.maven_group
          base { archivesName = project.archives_base_name }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
          }

          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") { expand "version": project.version }
          }

          tasks.withType(JavaCompile).configureEach { it.options.release = 21; it.options.encoding = 'UTF-8' }

          java {
              withSourcesJar()
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }
          EOF_DL
          cat > "gradle.properties" <<'EOF_DL'
          org.gradle.jvmargs=-Xmx2G
          minecraft_version=1.21.4
          yarn_mappings=1.21.4+build.8
          loader_version=0.16.10
          fabric_version=0.119.2+1.21.4
          mod_version=1.3.0
          maven_group=com.donutlike
          archives_base_name=donutlike
          EOF_DL
          cat > "settings.gradle" <<'EOF_DL'
          pluginManagement {
              repositories {
                  maven { url = 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          EOF_DL
          mkdir -p "src/main/java/com/donutlike"
          cat > "src/main/java/com/donutlike/Admin.java" <<'EOF_DL'
          package com.donutlike;

          import com.mojang.brigadier.CommandDispatcher;
          import com.mojang.brigadier.arguments.DoubleArgumentType;
          import com.mojang.brigadier.arguments.StringArgumentType;
          import net.minecraft.component.DataComponentTypes;
          import net.minecraft.component.type.LoreComponent;
          import net.minecraft.entity.player.PlayerEntity;
          import net.minecraft.entity.player.PlayerInventory;
          import net.minecraft.inventory.SimpleInventory;
          import net.minecraft.item.ItemStack;
          import net.minecraft.item.Items;
          import net.minecraft.screen.GenericContainerScreenHandler;
          import net.minecraft.screen.ScreenHandlerType;
          import net.minecraft.screen.SimpleNamedScreenHandlerFactory;
          import net.minecraft.screen.slot.SlotActionType;
          import net.minecraft.server.command.ServerCommandSource;
          import net.minecraft.server.network.ServerPlayerEntity;
          import net.minecraft.text.Text;

          import java.util.*;

          import static net.minecraft.server.command.CommandManager.argument;
          import static net.minecraft.server.command.CommandManager.literal;

          /**
           * Menu admin: /dladmin  -> GUI bat/tat tung tinh nang + chinh so.
           * Cong tac tong (master) tat het = server chay gan nhu vanilla (tien cho server khac / modpack khac).
           * Lenh: /dladmin | list | toggle <key> | set <key> <so> | master | reset
           */
          public class Admin {
              /** key -> {ten hien thi, mo ta} (thu tu = thu tu hien trong menu) */
              static final LinkedHashMap<String, String[]> FEATURES = new LinkedHashMap<>();
              /** key -> {ten, mac dinh, buoc, min, max} */
              static final LinkedHashMap<String, double[]> NUMS = new LinkedHashMap<>();
              static final Map<String, String> NUM_NAMES = new HashMap<>();
              static {
                  f("ah", "Auction House", "/ah, /ah sell, /ah search");
                  f("orders", "Orders", "/orders, /order");
                  f("combat", "Combat tag", "/ct, tag khi đánh nhau, chặn tp, thoát = chết");
                  f("spawnpvp", "Khoá PvP ở spawn", "Vùng quanh spawn không đánh nhau");
                  f("pvpcmd", "Lệnh /pvp", "Bật/tắt PvP cá nhân");
                  f("notes", "Tờ séc & vé rank", "/withdraw, /redeem, /rankvoucher");
                  f("suicide", "Lệnh /suicide", "Tự sát nhanh");
                  f("mobstack", "Gộp quái", "Creeper x100...");
                  f("itemclean", "Dọn item rơi", "Xoá item cũ khi quá nhiều");
                  f("amethyst", "Amethyst hết hạn", "Đồ Amethyst tự huỷ sau N giờ");
                  f("bedlock", "Khoá nổ giường", "Giường ở Nether/End không dùng được");
                  f("anchorlock", "Khoá Respawn Anchor", "Anchor ngoài Nether không dùng được");
                  f("shop", "Shop & /sellall", "/shop, /sellall, /worth");
                  f("sidebar", "Bảng bên phải", "Sidebar tiền/kills/...");
                  f("duels", "Duel bot", "/duel");
                  f("bases", "Căn cứ rải rác", "Tự sinh căn cứ & /randombase");
                  n("combat_seconds", "Giây combat", 15, 5, 1, 120);
                  n("spawn_radius", "Bán kính spawn (block)", 48, 8, 0, 512);
                  n("max_listings", "Số món /ah tối đa", 5, 1, 1, 54);
                  n("max_orders", "Số order tối đa", 5, 1, 1, 54);
                  n("max_stack", "Gộp quái tối đa", 100, 10, 2, 1000);
                  n("item_cap", "Ngưỡng dọn item", 300, 50, 50, 5000);
                  n("amethyst_hours", "Giờ sống Amethyst", 72, 6, 1, 720);
              }
              static void f(String k, String name, String desc) { FEATURES.put(k, new String[]{name, desc}); }
              static void n(String k, String name, double def, double step, double min, double max) {
                  NUMS.put(k, new double[]{def, step, min, max}); NUM_NAMES.put(k, name);
              }

              // ===== API cho cac module khac =====
              public static boolean on(String key) {
                  if (DonutLike.save.masterOff) return false;
                  Boolean b = DonutLike.save.toggles == null ? null : DonutLike.save.toggles.get(key);
                  return b == null || b;
              }
              public static double num(String key) {
                  Double v = DonutLike.save.nums == null ? null : DonutLike.save.nums.get(key);
                  return v != null ? v : NUMS.get(key)[0];
              }
              public static int inum(String key) { return (int) Math.round(num(key)); }

              static void setNum(String key, double v) {
                  double[] d = NUMS.get(key);
                  v = Math.max(d[2], Math.min(d[3], v));
                  if (DonutLike.save.nums == null) DonutLike.save.nums = new HashMap<>();
                  DonutLike.save.nums.put(key, v);
                  DonutLike.doSave();
              }
              static boolean toggle(String key) {
                  if (DonutLike.save.toggles == null) DonutLike.save.toggles = new HashMap<>();
                  boolean nv = !(DonutLike.save.toggles.getOrDefault(key, true));
                  DonutLike.save.toggles.put(key, nv);
                  DonutLike.doSave();
                  return nv;
              }

              // ===== lenh =====
              static void register(CommandDispatcher<ServerCommandSource> d) {
                  for (String root : new String[]{"dladmin", "dlmenu"}) {
                      d.register(literal(root).requires(s -> s.hasPermissionLevel(2))
                          .executes(c -> { open(c.getSource().getPlayerOrThrow()); return 1; })
                          .then(literal("list").executes(c -> {
                              StringBuilder sb = new StringBuilder("§6=== DonutLike ===  Master: " + (DonutLike.save.masterOff ? "§cTẮT" : "§aBẬT") + "\n");
                              for (var e : FEATURES.entrySet()) sb.append(on(e.getKey()) ? "§a✔ " : "§c✘ ").append("§f").append(e.getKey()).append(" §7- ").append(e.getValue()[0]).append("\n");
                              for (String k : NUMS.keySet()) sb.append("§e").append(k).append(" = §f").append(fmtNum(num(k))).append("\n");
                              c.getSource().sendFeedback(() -> Text.literal(sb.toString()), false);
                              return 1;
                          }))
                          .then(literal("toggle").then(argument("key", StringArgumentType.word())
                              .suggests((c, b) -> { FEATURES.keySet().forEach(b::suggest); return b.buildFuture(); })
                              .executes(c -> {
                                  String k = StringArgumentType.getString(c, "key");
                                  if (!FEATURES.containsKey(k)) { c.getSource().sendError(Text.literal("Không có tính năng: " + k)); return 0; }
                                  boolean v = toggle(k);
                                  c.getSource().sendFeedback(() -> Text.literal("§e" + k + ": " + (v ? "§aBẬT" : "§cTẮT")), true);
                                  return 1;
                              })))
                          .then(literal("set").then(argument("key", StringArgumentType.word())
                              .suggests((c, b) -> { NUMS.keySet().forEach(b::suggest); return b.buildFuture(); })
                              .then(argument("value", DoubleArgumentType.doubleArg()).executes(c -> {
                                  String k = StringArgumentType.getString(c, "key");
                                  if (!NUMS.containsKey(k)) { c.getSource().sendError(Text.literal("Không có thiết lập: " + k)); return 0; }
                                  setNum(k, DoubleArgumentType.getDouble(c, "value"));
                                  c.getSource().sendFeedback(() -> Text.literal("§e" + k + " = §f" + fmtNum(num(k))), true);
                                  return 1;
                              }))))
                          .then(literal("master").executes(c -> {
                              DonutLike.save.masterOff = !DonutLike.save.masterOff;
                              DonutLike.doSave();
                              c.getSource().sendFeedback(() -> Text.literal("§eMod: " + (DonutLike.save.masterOff ? "§cTẮT TOÀN BỘ (vanilla)" : "§aBẬT")), true);
                              return 1;
                          }))
                          .then(literal("reset").executes(c -> {
                              DonutLike.save.toggles = new HashMap<>(); DonutLike.save.nums = new HashMap<>(); DonutLike.save.masterOff = false;
                              DonutLike.doSave();
                              c.getSource().sendFeedback(() -> Text.literal("§aĐã reset toàn bộ thiết lập về mặc định."), true);
                              return 1;
                          })));
                  }
              }

              static String fmtNum(double v) { return v == Math.rint(v) ? String.valueOf((long) v) : String.valueOf(v); }

              // ===== GUI =====
              static void open(ServerPlayerEntity p) {
                  p.openHandledScreen(new SimpleNamedScreenHandlerFactory(
                      (id, inv, pl) -> new Gui(id, inv, new SimpleInventory(54)), Text.literal("DonutLike Admin")));
              }

              static ItemStack icon(net.minecraft.item.Item it, String name, String... lore) {
                  ItemStack s = new ItemStack(it);
                  s.set(DataComponentTypes.CUSTOM_NAME, Text.literal(name));
                  List<Text> l = new ArrayList<>();
                  for (String x : lore) l.add(Text.literal(x));
                  s.set(DataComponentTypes.LORE, new LoreComponent(l));
                  return s;
              }

              static class Gui extends GenericContainerScreenHandler {
                  final SimpleInventory inv;
                  final List<String> featKeys = new ArrayList<>(FEATURES.keySet());
                  final List<String> numKeys = new ArrayList<>(NUMS.keySet());

                  Gui(int id, PlayerInventory pinv, SimpleInventory inv) {
                      super(ScreenHandlerType.GENERIC_9X6, id, pinv, inv, 6);
                      this.inv = inv;
                      refresh();
                  }

                  // tinh nang: slot 0..17 (2 hang). Thiet lap so: slot 27..(27+n). Master: 49. Reset: 53.
                  void refresh() {
                      for (int i = 0; i < 54; i++) inv.setStack(i, icon(Items.GRAY_STAINED_GLASS_PANE, " "));
                      for (int i = 0; i < featKeys.size() && i < 27; i++) {
                          String k = featKeys.get(i); String[] f = FEATURES.get(k);
                          boolean on = DonutLike.save.toggles == null || DonutLike.save.toggles.getOrDefault(k, true);
                          inv.setStack(i, icon(on ? Items.LIME_CONCRETE : Items.RED_CONCRETE,
                              (on ? "§a✔ " : "§c✘ ") + "§f" + f[0], "§7" + f[1], "§8key: " + k, "§eClick để " + (on ? "TẮT" : "BẬT")));
                      }
                      for (int i = 0; i < numKeys.size() && 27 + i < 45; i++) {
                          String k = numKeys.get(i); double[] d = NUMS.get(k);
                          inv.setStack(27 + i, icon(Items.PAPER, "§e" + NUM_NAMES.get(k) + ": §f" + fmtNum(num(k)),
                              "§7Mặc định: " + fmtNum(d[0]), "§aChuột trái: +" + fmtNum(d[1]) + "  §cChuột phải: -" + fmtNum(d[1]),
                              "§7Shift: x5"));
                      }
                      inv.setStack(49, icon(DonutLike.save.masterOff ? Items.BARRIER : Items.BEACON,
                          "§6Master: " + (DonutLike.save.masterOff ? "§cTẮT (vanilla)" : "§aBẬT"),
                          "§7Tắt = mod ngừng hoạt động hoàn toàn", "§eClick để đổi"));
                      inv.setStack(53, icon(Items.TNT, "§cReset mặc định", "§7Click để reset mọi thiết lập"));
                  }

                  @Override
                  public void onSlotClick(int slot, int button, SlotActionType type, PlayerEntity player) {
                      if (slot >= 0 && slot < 54 && player instanceof ServerPlayerEntity sp && sp.hasPermissionLevel(2)
                              && (type == SlotActionType.PICKUP || type == SlotActionType.QUICK_MOVE)) {
                          if (slot < featKeys.size() && slot < 27) toggle(featKeys.get(slot));
                          else if (slot >= 27 && slot - 27 < numKeys.size() && slot < 45) {
                              String k = numKeys.get(slot - 27);
                              double step = NUMS.get(k)[1] * (type == SlotActionType.QUICK_MOVE ? 5 : 1);
                              setNum(k, num(k) + (button == 1 ? -step : step));
                          } else if (slot == 49) { DonutLike.save.masterOff = !DonutLike.save.masterOff; DonutLike.doSave(); }
                          else if (slot == 53) {
                              DonutLike.save.toggles = new HashMap<>(); DonutLike.save.nums = new HashMap<>(); DonutLike.save.masterOff = false;
                              DonutLike.doSave();
                          }
                          refresh();
                      }
                      syncState();
                  }

                  @Override public ItemStack quickMove(PlayerEntity player, int slot) { return ItemStack.EMPTY; }
              }
          }
          EOF_DL
          mkdir -p "src/main/java/com/donutlike"
          cat > "src/main/java/com/donutlike/AntiLag.java" <<'EOF_DL'
          package com.donutlike;

          import com.mojang.brigadier.CommandDispatcher;
          import com.mojang.brigadier.arguments.StringArgumentType;
          import net.fabricmc.fabric.api.entity.event.v1.ServerLivingEntityEvents;
          import net.fabricmc.fabric.api.event.player.UseBlockCallback;
          import net.minecraft.block.BedBlock;
          import net.minecraft.block.RespawnAnchorBlock;
          import net.minecraft.command.argument.EntityArgumentType;
          import net.minecraft.component.DataComponentTypes;
          import net.minecraft.component.type.LoreComponent;
          import net.minecraft.component.type.NbtComponent;
          import net.minecraft.entity.Entity;
          import net.minecraft.entity.SpawnReason;
          import net.minecraft.entity.ItemEntity;
          import net.minecraft.entity.mob.HostileEntity;
          import net.minecraft.entity.mob.MobEntity;
          import net.minecraft.entity.boss.WitherEntity;
          import net.minecraft.inventory.Inventory;
          import net.minecraft.item.Item;
          import net.minecraft.item.ItemStack;
          import net.minecraft.item.Items;
          import net.minecraft.nbt.NbtCompound;
          import net.minecraft.server.MinecraftServer;
          import net.minecraft.server.command.ServerCommandSource;
          import net.minecraft.server.network.ServerPlayerEntity;
          import net.minecraft.server.world.ServerWorld;
          import net.minecraft.text.Text;
          import net.minecraft.util.ActionResult;
          import net.minecraft.world.World;

          import java.util.*;

          import static net.minecraft.server.command.CommandManager.argument;
          import static net.minecraft.server.command.CommandManager.literal;

          /**
           * Chong lag kieu DonutSMP cu:
           *  1) Gop quai (mob stacking): "Creeper x100", chem chet tru 1, roi loot 1 con.
           *  2) Don item roi duoi dat khi qua nhieu.
           *  3) Do Amethyst tu huy sau 72h (thoi gian thuc), thong bao mau tim.
           *  4) Khoa no giuong (Nether/End) va Respawn Anchor (ngoai Nether). TNT + End Crystal van no binh thuong.
           */
          public class AntiLag {
              static int maxStack() { return Admin.inum("max_stack"); }
              static final int MERGE_INTERVAL_TICKS = 100;   // 5s
              static int itemCap() { return Admin.inum("item_cap"); }
              static long amethystLifetimeMs() { return (long) (Admin.num("amethyst_hours") * 3600_000L); }
              static final String STACK_PREFIX = "dlstack:";

              static final Map<String, Item> AMETHYST_BASE = new LinkedHashMap<>();
              static {
                  AMETHYST_BASE.put("sword", Items.NETHERITE_SWORD); AMETHYST_BASE.put("pickaxe", Items.NETHERITE_PICKAXE);
                  AMETHYST_BASE.put("axe", Items.NETHERITE_AXE); AMETHYST_BASE.put("shovel", Items.NETHERITE_SHOVEL);
                  AMETHYST_BASE.put("helmet", Items.NETHERITE_HELMET); AMETHYST_BASE.put("chestplate", Items.NETHERITE_CHESTPLATE);
                  AMETHYST_BASE.put("leggings", Items.NETHERITE_LEGGINGS); AMETHYST_BASE.put("boots", Items.NETHERITE_BOOTS);
              }

              // ---------- stack helpers (luu trong command tags => ton tai qua restart) ----------
              static int getCount(Entity e) {
                  for (String t : e.getCommandTags()) if (t.startsWith(STACK_PREFIX)) {
                      try { return Integer.parseInt(t.substring(STACK_PREFIX.length())); } catch (Exception ignored) {}
                  }
                  return 0;
              }

              static void setCount(MobEntity m, int n) {
                  for (String t : new ArrayList<>(m.getCommandTags())) if (t.startsWith(STACK_PREFIX)) m.removeCommandTag(t);
                  if (n > 1) {
                      m.addCommandTag(STACK_PREFIX + n);
                      m.setCustomName(Text.literal("§c" + m.getType().getName().getString() + " x" + n));
                      m.setCustomNameVisible(true);
                  } else {
                      m.setCustomName(null);
                      m.setCustomNameVisible(false);
                  }
              }

              static boolean stackable(Entity e) {
                  if (!(e instanceof HostileEntity m) || !m.isAlive()) return false;
                  if (m instanceof WitherEntity || m.hasVehicle() || m.hasPassengers()) return false;
                  return !m.hasCustomName() || getCount(m) > 0; // bo qua quai co ten (boss, bot duel...)
              }

              // ---------- init ----------
              static void init() {
                  // chem chet 1 con trong stack -> sinh lai stack con (count-1), con vua chet roi loot binh thuong
                  ServerLivingEntityEvents.AFTER_DEATH.register((entity, src) -> {
                      if (!Admin.on("mobstack") || !(entity instanceof MobEntity m) || !(m.getWorld() instanceof ServerWorld w)) return;
                      int n = getCount(m);
                      if (n <= 1) return;
                      Entity e = m.getType().create(w, SpawnReason.EVENT);
                      if (e instanceof MobEntity clone) {
                          clone.refreshPositionAndAngles(m.getX(), m.getY(), m.getZ(), m.getYaw(), 0);
                          setCount(clone, n - 1);
                          w.spawnEntity(clone);
                      }
                  });

                  UseBlockCallback.EVENT.register((player, world, hand, hit) -> {
                      if (world.isClient) return ActionResult.PASS;
                      var pos = hit.getBlockPos();
                      var block = world.getBlockState(pos).getBlock();
                      // khoa no giuong / anchor
                      if (Admin.on("bedlock") && block instanceof BedBlock && !world.getRegistryKey().equals(World.OVERWORLD)) {
                          player.sendMessage(Text.literal("§cGiường bị khoá ở thế giới này (chống nổ/lag)."), true);
                          return ActionResult.FAIL;
                      }
                      if (Admin.on("anchorlock") && block instanceof RespawnAnchorBlock && !world.getRegistryKey().equals(World.NETHER)) {
                          player.sendMessage(Text.literal("§cRespawn Anchor bị khoá ở thế giới này."), true);
                          return ActionResult.FAIL;
                      }
                      // mo ruong -> quet Amethyst het han
                      if (Admin.on("amethyst") && world.getBlockEntity(pos) instanceof Inventory inv) purge(inv, null);
                      return ActionResult.PASS;
                  });
              }

              // ---------- moi giay ----------
              static void everySecond(MinecraftServer s) {
                  long t = DonutLike.tick;
                  if (t % MERGE_INTERVAL_TICKS == 0 && Admin.on("mobstack")) for (ServerWorld w : s.getWorlds()) mergeMobs(w);
                  if (t % 200 == 0 && Admin.on("itemclean")) for (ServerWorld w : s.getWorlds()) cleanItems(w);
                  if (t % 200 == 0 && Admin.on("amethyst")) for (ServerPlayerEntity p : s.getPlayerManager().getPlayerList()) {
                      purge(p.getInventory(), p);
                      purge(p.getEnderChestInventory(), p);
                  }
              }

              static void mergeMobs(ServerWorld w) {
                  Map<String, List<HostileEntity>> groups = new HashMap<>();
                  List<Entity> all = new ArrayList<>();
                  for (Entity e : w.iterateEntities()) all.add(e);
                  for (Entity e : all) {
                      if (!stackable(e)) continue;
                      HostileEntity m = (HostileEntity) e;
                      String key = m.getType().getTranslationKey() + ":" + ((int) m.getX() >> 3) + ":" + ((int) m.getY() >> 2) + ":" + ((int) m.getZ() >> 3);
                      groups.computeIfAbsent(key, k -> new ArrayList<>()).add(m);
                  }
                  for (List<HostileEntity> g : groups.values()) {
                      if (g.size() < 2) continue;
                      HostileEntity keep = g.get(0);
                      int total = Math.max(1, getCount(keep));
                      for (int i = 1; i < g.size(); i++) {
                          HostileEntity o = g.get(i);
                          int c = Math.max(1, getCount(o));
                          if (total + c > maxStack()) continue;
                          total += c;
                          o.discard();
                      }
                      if (total > 1) setCount(keep, total);
                  }
              }

              static void cleanItems(ServerWorld w) {
                  List<ItemEntity> items = new ArrayList<>();
                  for (Entity e : w.iterateEntities()) if (e instanceof ItemEntity ie) items.add(ie);
                  if (items.size() <= itemCap()) return;
                  for (ItemEntity ie : items) if (ie.getItemAge() > 1200) ie.discard();
              }

              // ---------- Amethyst ----------
              static boolean expired(ItemStack s) {
                  if (s.isEmpty()) return false;
                  NbtComponent c = s.get(DataComponentTypes.CUSTOM_DATA);
                  if (c == null) return false;
                  NbtCompound n = c.copyNbt();
                  return n.contains("dl_expire") && System.currentTimeMillis() >= n.getLong("dl_expire");
              }

              static void purge(Inventory inv, ServerPlayerEntity notify) {
                  int removed = 0;
                  for (int i = 0; i < inv.size(); i++) {
                      if (expired(inv.getStack(i))) { inv.setStack(i, ItemStack.EMPTY); removed++; }
                  }
                  if (removed > 0 && notify != null) notify.sendMessage(Text.literal("§5Sức mạnh của Amethyst đã cạn kiệt"), false);
              }

              static ItemStack makeAmethyst(String type) {
                  Item base = AMETHYST_BASE.get(type);
                  ItemStack s = new ItemStack(base);
                  long exp = System.currentTimeMillis() + amethystLifetimeMs();
                  NbtCompound n = new NbtCompound();
                  n.putByte("dl_amethyst", (byte) 1);
                  n.putLong("dl_expire", exp);
                  s.set(DataComponentTypes.CUSTOM_DATA, NbtComponent.of(n));
                  s.set(DataComponentTypes.CUSTOM_NAME, Text.literal("§dAmethyst " + type.substring(0, 1).toUpperCase() + type.substring(1)));
                  s.set(DataComponentTypes.LORE, new LoreComponent(List.of(
                      Text.literal("§5Tự huỷ sau " + Admin.inum("amethyst_hours") + " giờ (thời gian thực)"),
                      Text.literal("§7Hết hạn: " + new Date(exp)))));
                  return s;
              }

              static void register(CommandDispatcher<ServerCommandSource> d) {
                  // /amethyst <player> <sword|pickaxe|...> (op)
                  d.register(literal("amethyst").requires(src -> src.hasPermissionLevel(2) && Admin.on("amethyst"))
                      .then(argument("player", EntityArgumentType.player())
                      .then(argument("type", StringArgumentType.word()).suggests((c, b) -> {
                          AMETHYST_BASE.keySet().forEach(b::suggest); return b.buildFuture(); })
                      .executes(c -> {
                          String type = StringArgumentType.getString(c, "type");
                          if (!AMETHYST_BASE.containsKey(type)) { c.getSource().sendError(Text.literal("Loại: " + AMETHYST_BASE.keySet())); return 0; }
                          EntityArgumentType.getPlayer(c, "player").getInventory().offerOrDrop(makeAmethyst(type));
                          return 1;
                      }))));
              }
          }
